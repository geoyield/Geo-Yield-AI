name: Deploy API

# ==============================================================================
# WORKFLOW DE DESPLIEGUE CONTINUO (CD)
# ==============================================================================
# Refactorización de Arquitectura: Se ha eliminado el flujo heredado (legacy) 
# que dependía de la descarga de modelos scikit-learn desde GitHub Releases, 
# ya que la lógica actual delega esto en la arquitectura RAG (ver api.py).

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Tag de Git a desplegar (usar "latest" para resolver al más reciente)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Inyección de configuración de entorno.
    # Corrección de Seguridad: DATABASE_URL se ha migrado explícitamente 
    # del contexto 'vars' al contexto 'secrets', dado que las cadenas de 
    # conexión exponen credenciales de autenticación en texto plano.
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
      
    steps:
      # 1. Obtención del código fuente completo (incluyendo historial de tags)
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Resolución dinámica de la versión a desplegar
      - name: Resolve target tag
        id: resolve_tag
        run: |
          if [[ "${{ inputs.api_version }}" == "latest" ]]; then
            tag=$(git tag | sort -r | head -n1)
          else
            tag="${{ inputs.api_version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # 3. Posicionamiento en el commit exacto de la versión (Despliegue determinista)
      - name: Checkout target tag
        run: git checkout ${{ steps.resolve_tag.outputs.tag }}

      # 4. Notificación al proveedor Cloud (Render) vía Webhook
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"