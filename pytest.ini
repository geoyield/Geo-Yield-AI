# ==============================================================================
# CONFIGURACIÓN DEL FRAMEWORK DE TESTING (Pytest)
# ==============================================================================

[pytest]
# Inyección dinámica en el PYTHONPATH.
# El punto (.) representa la raíz del repositorio. 
# Esto garantiza que todos los scripts de prueba (dentro de tests/) puedan 
# importar el paquete "backend" de forma absoluta (ej. from backend.db import...),
# solucionando los problemas de ModuleNotFoundError sin necesidad de obligar al 
# desarrollador a usar trucos de consola como `PYTHONPATH=. pytest`.
pythonpath = .