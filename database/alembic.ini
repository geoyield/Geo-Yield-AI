[alembic]
# Alembic resuelve script_location relativo al directorio de trabajo desde
# el que se invoca el comando, no relativo a este .ini. Se asume que siempre
# se ejecuta desde la raíz del repo (ver docstring en env.py).
script_location = database/alembic

# sqlalchemy.url se resuelve dinámicamente en env.py a partir de la variable
# de entorno DATABASE_URL (.env de la raíz del repo), para no duplicar la
# cadena de conexión en dos sitios ni comitear credenciales.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
