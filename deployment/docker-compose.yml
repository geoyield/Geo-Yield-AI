# ==============================================================================
# ORQUESTACIÓN DE INFRAESTRUCTURA LOCAL (Docker Compose)
# ==============================================================================
# Este archivo define y coordina los contenedores del proyecto Geo-Yield-AI.
# Sigue el principio de separación de responsabilidades:
# 1. Capa de Datos (postgis): Almacenamiento relacional, espacial y vectorial.
# 2. Capa de Lógica (api): Backend centralizado en FastAPI.
# ==============================================================================

services:

  postgis:
    # Decisión de Diseño (Custom Build): 
    # En lugar de usar la imagen oficial prefabricada, construimos una propia 
    # basada en deployment/Dockerfile.postgis. Esto nos permite unificar 
    # PostgreSQL, PostGIS (datos espaciales) y pgvector (motor IA/RAG) en un 
    # solo motor de base de datos, optimizando recursos.
    build:
      context: ..
      dockerfile: deployment/Dockerfile.postgis
    container_name: geoyield_db
    # Política de reinicio: El contenedor sobrevive a reinicios del equipo, 
    # pero respeta si el desarrollador lo detiene manualmente con 'stop'.
    restart: unless-stopped
    # Gestión de Secretos y Variables:
    # Utilizamos un único archivo .env en la raíz como única fuente de verdad.
    # Nota técnica: Evitamos usar el bloque 'environment:' aquí porque Docker 
    # Compose intentaría interpolar las variables antes de tiempo (dejándolas 
    # vacías) y sobrescribiría los valores correctos inyectados por 'env_file'
    env_file:
      - ../.env
    # Exposición de Puertos (Trade-off de Desarrollo):
    # En producción este puerto estaría cerrado al exterior. En desarrollo lo 
    # mapeamos al host (5432) para poder lanzar las migraciones (Alembic) y 
    # cargar los datos (ETL) cómodamente desde nuestro entorno local.    
    ports:
      - "5432:5432"
    volumes:
    # Persistencia de Datos:
    # Ajuste específico para imágenes oficiales a partir de PostgreSQL 18:
    # El volumen debe montarse en el directorio padre (/var/lib/postgresql) 
    # ya que la imagen gestiona internamente las subcarpetas por versión.
      - geoyield_db:/var/lib/postgresql
    networks:
      - geoyield_net
    # Comprobación de Salud (Healthcheck):
    # Garantiza que la base de datos esté lista para aceptar conexiones TCP 
    # antes de que la API intente arrancar.
    # Nota técnica: Usamos el doble dólar ($$) para evitar que Compose evalúe 
    # la variable al leer el YAML; queremos que la evalúe el shell DENTRO 
    # del contenedor usando los valores del archivo .env.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      # El contexto de construcción ('context') se define en la raíz del 
      # repositorio ('..') para que el Dockerfile pueda acceder a la carpeta 
      # /backend y copiar el código fuente de la aplicación.
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: geoyield_api
    restart: unless-stopped
    env_file:
      - ../.env
    # Mapeo de Puertos para evitar colisiones:
    # La API corre internamente en el puerto 8000, pero la exponemos al 8080 
    # para no entrar en conflicto con otras aplicaciones locales del host.
    ports:
      - "8080:8000"
    volumes:
      - geoyield_logs:/app/backend/api/logs
    networks:
      - geoyield_net
    # Dependencia de Inicialización:
    # Gracias al bloque 'condition: service_healthy', Docker espera pacientemente 
    # a que la base de datos confirme que está operativa antes de arrancar la API.
    depends_on:
      postgis:
        condition: service_healthy

# ==============================================================================
# RECURSOS GESTIONADOS POR DOCKER
# ==============================================================================

# Volúmenes Nombrados (Named Volumes):
# Se delega la persistencia al motor de Docker en lugar de mapear carpetas 
# del sistema operativo (Bind Mounts), evitando así problemas de permisos 
# (especialmente entre Linux/Windows/macOS).
volumes:
  geoyield_db:
  geoyield_logs:

# Red Interna (Bridge):
# Aísla la comunicación entre contenedores, permitiéndoles descubrirse 
# mediante resolución DNS automática (usando los nombres de servicio: 'postgis').
networks:
  geoyield_net:
    driver: bridge