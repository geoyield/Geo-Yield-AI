services:

  postgis:
    # Imagen oficial de PostGIS: incluye PostgreSQL + extensión PostGIS, lista
    # para datos geoespaciales sin configuración adicional. pgvector (motor
    # RAG, Fase 2) se instalará como extensión adicional sobre esta misma
    # base de datos — no hace falta un segundo servicio.
    # Se construye desde deployment/Dockerfile.postgis (Postgres + PostGIS +
    # pgvector) en vez de descargar la imagen oficial de postgis/postgis
    # directamente: esa imagen NO trae pgvector (confirmado en ejecución
    # real: "CREATE EXTENSION vector" falla con "extension is not
    # available" contra la imagen sin modificar).
    build:
      context: ..
      dockerfile: deployment/Dockerfile.postgis
    container_name: geoyield_db
    # Se reinicia solo cuando Docker vuelve a arrancar (p. ej. al abrir
    # WSL), sin necesidad de correr "docker compose up" a mano cada vez.
    # "unless-stopped" respeta que lo hayas parado tú explícitamente con
    # "docker compose stop" -- solo se reinicia solo tras un reinicio de
    # Docker/WSL, no si lo paraste a propósito.
    restart: unless-stopped
    env_file:
      - ../.env  # .env único en la raíz del repo (antes había ambigüedad entre uno en deployment/ y otro en la raíz)
    # NOTA (bug real, detectado en ejecución): no se declara aquí un bloque
    # "environment: POSTGRES_DB: ${POSTGRES_DB}..." adicional. Docker Compose
    # interpola ${VAR} al parsear el YAML usando el .env del directorio del
    # propio compose file (deployment/), NO el de env_file (../.env) -- como
    # aquí no hay ningún .env, esas variables se resuelven como cadenas
    # vacías, y al tener "environment:" prioridad sobre "env_file:", pisaban
    # los valores correctos que env_file sí había inyectado bien. Resultado:
    # POSTGRES_PASSWORD llegaba vacío al contenedor y Postgres se negaba a
    # arrancar. env_file por sí solo ya es suficiente para pasar estas
    # variables al contenedor -- no hace falta duplicarlas.
    # Publicado al host (no solo 'expose') para poder ejecutar Alembic y el
    # ETL desde fuera de Docker durante el desarrollo (ver README, Fase 1).
    # Trade-off consciente para un entorno de desarrollo local: en un
    # despliegue real, esto no debería publicarse al host.
    # Honours POSTGRES_HOST_PORT from the root .env, so a Postgres already
    # running on the host does not block startup. Interpolation reads the
    # .env of the compose file's directory, so run compose with
    # `--env-file .env` from the repo root (see README).
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      # A partir de Postgres/PostGIS 18, las imágenes oficiales esperan el
      # volumen montado en /var/lib/postgresql (el directorio PADRE), no en
      # /var/lib/postgresql/data como en versiones anteriores -- gestionan
      # internamente las subcarpetas por versión mayor (estilo
      # pg_ctlcluster). Montar directamente en .../data (como se hacía
      # antes) hace que el contenedor se niegue a arrancar. Ver
      # https://github.com/docker-library/postgres/pull/1259
      - geoyield_db:/var/lib/postgresql
    networks:
      - geoyield_net
    # Da un periodo de gracia de 30s y hasta 5 reintentos (cada 10s) antes de
    # declarar la base de datos 'unhealthy', para que la api no intente
    # conectar antes de que Postgres esté listo para aceptar conexiones.
    #
    # CORRECCIÓN: el healthcheck original ("geoyield ping") no es un comando
    # real. pg_isready sí lo es y viene incluido en la imagen de PostGIS.
    # $$POSTGRES_USER / $$POSTGRES_DB (con doble $) es intencionado: evita
    # que Compose los interpole al parsear el YAML (el mismo problema del
    # bloque "environment" de arriba) y hace que el propio shell DENTRO del
    # contenedor los expanda al ejecutar el healthcheck, tomándolos de las
    # variables que env_file sí inyectó correctamente.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      # CORRECCIÓN: el contexto debe ser la raíz del repo, no deployment/,
      # porque el Dockerfile necesita copiar backend/. Con el contexto
      # anterior (implícito, deployment/) esa carpeta quedaba fuera del build.
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: geoyield_api
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8080:8000"
    # No log volume any more: logs go to stdout as JSON (one line per event),
    # which is what both `docker compose logs` and the ECS awslogs/FireLens
    # drivers collect. A file inside the container reaches no collector.
    #   docker compose logs -f api | jq .
    networks:
      - geoyield_net
    depends_on:
      postgis:
        condition: service_healthy

# Volúmenes gestionados por Docker (no mapeados a directorios del host) para
# evitar problemas de permisos y dejar la persistencia en manos de Docker.
volumes:
  geoyield_db:

networks:
  geoyield_net:
    driver: bridge