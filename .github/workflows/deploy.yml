name: Deploy API

# CORRECCIÓN (Fase 0): se retira el input "model_release" y la variable de
# entorno MODEL_RELEASE. Pertenecían al flujo legacy que desplegaba un
# modelo scikit-learn descargado como GitHub Release; ese flujo se ha
# eliminado (ver backend/api/api.py). Además, el step de checkout
# referenciaba una variable "model_version" que nunca se había definido
# (bug real detectado en la auditoría).

on:
  workflow_dispatch:
    inputs:
      api_version:
        description: 'Tag de la API a desplegar (usar "latest" para el más reciente)'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # v4+ permite fetch de tags, necesario para poder desplegar un tag específico
        with:
          fetch-depth: 0

      - name: Resolve target tag
        id: resolve_tag
        run: |
          if [[ "${{ inputs.api_version }}" == "latest" ]]; then
            tag=$(git tag | sort -r | head -n1)
          else
            tag="${{ inputs.api_version }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout target tag
        run: git checkout ${{ steps.resolve_tag.outputs.tag }}

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"

# NOTA DE SEGURIDAD (Fase 0): DATABASE_URL se ha movido de "vars" (variables
# públicas del repo) a "secrets", ya que suele contener usuario y contraseña
# de la base de datos embebidos en la cadena de conexión. Hay que crear el
# secret "DATABASE_URL" en la configuración del repo/entorno de GitHub.
