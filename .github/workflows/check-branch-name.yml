name: Check Branch Name

# Se ejecuta automáticamente en la apertura o actualización de 
# cualquier Pull Request para validar las políticas de ramas.
on:
  pull_request:
    branches: ['*']

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # FASE 1: Validación de Nomenclatura Semántica
      # ------------------------------------------------------------------
      - name: Validate branch name
        run: |
          branch="${{ github.head_ref }}"
          echo "Branch name: $branch"
          
          # Exclusión de las ramas base (core) de Git-Flow.
          if [[ "$branch" == "develop" || "$branch" == "main" ]]; then
            echo "Branch '$branch' is a core Git-Flow branch. Bypassing naming validation."
            exit 0
          fi
          
          # Expresión regular que obliga a usar prefijos estándar de la industria.
          # Bloquea ramas sin categorizar para mantener el repositorio ordenado.
          if ! echo "$branch" | grep -qE '^(feat|fix|hotfix|chore|docs|refactor|test|release)/.+'; then
            echo "Invalid branch name: '$branch'"
            echo "Must follow: <type>/<description>"
            echo "Types: feat, fix, hotfix, chore, docs, refactor, test, release"
            exit 1 # Detiene la ejecución y marca el CI en rojo, bloqueando el merge.
          fi
          echo "Branch name is valid"

      # ------------------------------------------------------------------
      # FASE 2: Protección de la Arquitectura Git-Flow
      # ------------------------------------------------------------------
      - name: Enforce Git-Flow (Only allow develop to main)
        run: |
          target_branch="${{ github.base_ref }}"
          source_branch="${{ github.head_ref }}"
          echo "Target branch: $target_branch"
          echo "Source branch: $source_branch"

          # Restringe la subida directa de ramas de trabajo (feat/fix) a producción (main).
          # Fuerza a que todo el código se integre y valide primero en la rama 'develop'.
          if [[ "$target_branch" == "main" && "$source_branch" != "develop" ]]; then
            echo "ERROR: Violación de Git-Flow. Solo se permiten Pull Requests hacia 'main' desde la rama 'develop'."
            exit 1
          fi
          echo "Git-Flow branch alignment is valid."