# ==============================================================================
# CONFIGURACIÓN DE MIGRACIONES (ALEMBIC)
# ==============================================================================

[alembic]
# Decisión de diseño: Ruta de ejecución estricta.
# Alembic resuelve esta ruta de forma relativa al directorio desde el que 
# ejecutas el comando en la terminal. Para que esto funcione, 
# los comandos SIEMPRE se ejecutan desde la raíz del repo.
script_location = database/alembic

# IMPORTANTE (Ciberseguridad):
# Por defecto, Alembic pide poner aquí la variable 'sqlalchemy.url' con la 
# contraseña de la base de datos. Como este archivo se sube a GitHub, se he 
# borrado intencionadamente. La conexión real se resuelve dentro de 
# 'database/alembic/env.py' leyendo la variable de entorno oculta (DATABASE_URL).

# ==============================================================================
# CONFIGURACIÓN DE LOGS (Consola)
# ==============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
